name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ./verify.sh
        env:
          # vitest colour codes break verify.sh's 'Tests' summary grep
          NO_COLOR: "1"
          FORCE_COLOR: "0"
